# Laboratório "monitoramento de acesso a arquivos": MariaDB 11.4.13 (InnoDB + MooseDB) x ClickHouse.
#
#   cd lab/fileaccess
#   python scripts/gen_data.py --rows 20000000 --out data/20m      # uma vez (determinístico)
#   docker compose up -d --no-start                                # cria o volume de dados
#   docker run --rm -v fileacc-data:/d -v "$PWD/data:/src:ro" alpine cp -r /src/20m /d/   # copia p/ volume (bind do Windows é lento)
#   docker compose up -d
#   DATA=20m bash scripts/bench.sh | tee results/bench_20m.txt
#
# Recursos iguais nos dois servidores: 8 CPUs e 10 GiB de RAM por contêiner
# (host: 24 CPUs / 30 GiB). Dados em volumes nomeados fileacc-* (nunca no repo).
name: fileacc

services:
  mariadb:
    # O ha_moosedb.so de plugin/ foi compilado contra 11.4.13: não troque a tag sem recompilar.
    image: ${MARIADB_IMAGE:-mariadb:11.4.13}
    container_name: fileacc-mariadb
    cpus: 8
    mem_limit: 10g
    command:
      - --plugin-maturity=experimental
      - --plugin-load-add=ha_moosedb
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL:-6G}
      - --innodb-log-file-size=2G
      - --moosedb-chunk-cache-size=${MOOSEDB_CACHE:-1073741824}
      # GROUP BY grandes: evita conversão precoce da tabela temporária para disco
      - --tmp-table-size=512M
      - --max-heap-table-size=512M
      - --max-connections=50
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD:-fileacc}
    ports:
      - "${MARIADB_PORT:-13307}:3306"
    volumes:
      - fileacc-mariadb:/var/lib/mysql
      # Cópia própria do plugin (cp ../../build/ha_moosedb.so plugin/ com o
      # mariadb parado): montar build/ direto deixa um rebuild concorrente
      # sobrescrever o .so mapeado => SIGBUS.
      - ./plugin/ha_moosedb.so:/usr/lib/mysql/plugin/ha_moosedb.so:ro
      - ../../storage/moosedb/sql:/moosedb-sql:ro
      - ./sql:/lab/sql:ro
      - fileacc-data:/lab/data:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:26.9}
    container_name: fileacc-clickhouse
    cpus: 8
    mem_limit: 10g
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"      # usuário default sem senha, só na rede do compose/docker exec
    ports:
      - "${CH_HTTP_PORT:-18123}:8123"
    volumes:
      - fileacc-clickhouse:/var/lib/clickhouse
      - ./ch:/lab/ch:ro
      - fileacc-data:/lab/data:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  fileacc-mariadb:
    name: fileacc-mariadb
  fileacc-clickhouse:
    name: fileacc-clickhouse
  fileacc-data:
    name: fileacc-data
